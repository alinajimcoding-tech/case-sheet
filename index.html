<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DentalCase Pro Suite | تسجيل الدخول</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: { 50: '#f0f9ff', 100: '#e0f2fe', 400: '#38bdf8', 500: '#0ea5e9', 600: '#0284c7', 700: '#0369a1', 900: '#0c4a6e' }
                    },
                    fontFamily: { sans: ['IBM Plex Sans Arabic', 'sans-serif'], en: ['Readex Pro', 'sans-serif'] }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700;800&family=Readex+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --bg-body: #030712;
            --text-main: #e2e8f0;
            --text-muted: #94a3b8;
            --card-bg: rgba(15, 23, 42, 0.85);
            --card-border: rgba(56, 189, 248, 0.18);
            --input-bg: #090e1a;
            --input-border: rgba(56, 189, 248, 0.2);
            --btn-grad: linear-gradient(135deg, #0369a1 0%, #0284c7 40%, #0ea5e9 80%, #38bdf8 100%);
            --btn-shadow: 0 10px 30px -5px rgba(14, 165, 233, 0.4);
            --logo-bg: rgba(14, 165, 233, 0.15);
            --logo-border: rgba(56, 189, 248, 0.3);
            --logo-color: #38bdf8;
            --theme-btn-bg: #090e1a;
            --theme-btn-border: rgba(56, 189, 248, 0.2);
        }

        /* النموذج الملكي الأكاديمي للوضع النهاري */
        html[data-theme="light"] {
            --bg-body: #f4f4f7;
            --text-main: #18181b;
            --text-muted: #71717a;
            --card-bg: #ffffff;
            --card-border: #e4e4e7;
            --input-bg: #fafafa;
            --input-border: #d4d4d8;
            --btn-grad: linear-gradient(135deg, #1e40af 0%, #2563eb 100%);
            --btn-shadow: 0 10px 25px -5px rgba(37, 99, 235, 0.35);
            --logo-bg: rgba(37, 99, 235, 0.08);
            --logo-border: rgba(37, 99, 235, 0.2);
            --logo-color: #1d4ed8;
            --theme-btn-bg: #ffffff;
            --theme-btn-border: #e4e4e7;
        }

        * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            font-family: 'IBM Plex Sans Arabic', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow-x: hidden;
            margin: 0;
            padding: 1rem;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .ambient-glow {
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(14, 165, 233, 0.12) 0%, transparent 70%);
            border-radius: 50%;
            filter: blur(90px);
            pointer-events: none;
            z-index: 0;
        }
        html[data-theme="light"] .ambient-glow {
            background: radial-gradient(circle, rgba(37, 99, 235, 0.06) 0%, transparent 70%);
        }

        .bento-card {
            background: var(--card-bg);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--card-border);
            border-radius: 1.75rem;
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.25);
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 440px;
            margin: auto;
        }

        .glass-input {
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            color: var(--text-main);
            transition: all 0.2s ease;
            font-size: 14px;
        }
        .glass-input:focus {
            outline: none;
            border-color: #38bdf8;
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.25);
        }
        html[data-theme="light"] .glass-input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.2);
        }
        
        .btn-modern-ultra {
            position: relative;
            background: var(--btn-grad);
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.25s ease;
            box-shadow: var(--btn-shadow);
            overflow: hidden;
        }
        .btn-modern-ultra:hover {
            transform: translateY(-2px);
        }
        .btn-modern-ultra:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <div class="ambient-glow -top-32 -right-32"></div>
    <div class="ambient-glow -bottom-32 -left-32"></div>

    <!-- زر تبديل الوضع النهاري والليلي -->
    <div class="absolute top-4 left-4 z-20">
        <button onclick="toggleTheme()" class="w-10 h-10 rounded-2xl flex items-center justify-center text-sm shadow-sm transition" style="background: var(--theme-btn-bg); border: 1px solid var(--theme-btn-border); color: var(--logo-color);">
            <i id="themeIcon" class="fa-solid fa-moon"></i>
        </button>
    </div>

    <div class="bento-card p-6 sm:p-8 space-y-6">
        
        <!-- رأس البطاقة والأيقونة -->
        <div class="text-center space-y-2.5">
            <div style="background: var(--logo-bg); border: 1px solid var(--logo-border); color: var(--logo-color);" class="w-16 h-16 sm:w-20 sm:h-20 rounded-2xl flex items-center justify-center text-2xl sm:text-3xl mx-auto shadow-sm">
                <i class="fa-solid fa-tooth"></i>
            </div>
            <div>
                <h1 class="text-lg sm:text-xl font-extrabold tracking-tight">المنظومة السريرية لطب الأسنان</h1>
                <p style="color: var(--text-muted);" class="text-xs font-en mt-1 font-semibold">DentalCase Pro Suite • Clinical Portal</p>
            </div>
        </div>

        <!-- نموذج تسجيل الدخول -->
        <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4 text-xs sm:text-sm">
            <div>
                <label class="block font-bold mb-1.5 opacity-90 text-right">
                    <i class="fa-solid fa-user-pen ml-1.5 opacity-70"></i> اسم الطالب الرباعي واللقب:
                </label>
                <input type="text" id="login_name" required class="glass-input w-full px-3.5 py-2.5 sm:py-3 rounded-xl font-bold text-right" placeholder="مثال: علي نجم عبيد">
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div>
                    <label class="block font-bold mb-1.5 opacity-90 text-right">
                        <i class="fa-solid fa-users-rectangle ml-1.5 opacity-70"></i> المجموعة:
                    </label>
                    <input type="text" id="login_group" required class="glass-input w-full px-3 py-2.5 sm:py-3 rounded-xl font-en text-center font-bold" placeholder="e.g. D2">
                </div>
                <div>
                    <label class="block font-bold mb-1.5 opacity-90 text-right">
                        <i class="fa-solid fa-graduation-cap ml-1.5 opacity-70"></i> المرحلة:
                    </label>
                    <select id="login_stage" class="glass-input w-full px-3 py-2.5 sm:py-3 rounded-xl font-bold text-center">
                        <option value="4th Year">المرحلة الرابعة</option>
                        <option value="5th Year">المرحلة الخامسة</option>
                    </select>
                </div>
            </div>

            <div class="pt-2">
                <button type="submit" class="btn-modern-ultra w-full py-3 sm:py-3.5 rounded-xl text-white font-extrabold text-sm flex items-center justify-between px-4">
                    <span class="flex items-center gap-2">
                        <i class="fa-solid fa-arrow-right-to-bracket text-sm"></i>
                        <span>الانتقال إلى لوحة العيادات</span>
                    </span>
                    <div class="w-7 h-7 rounded-lg bg-white/15 flex items-center justify-center">
                        <i class="fa-solid fa-arrow-left text-xs"></i>
                    </div>
                </button>
            </div>
        </form>

        <div class="text-center border-t border-slate-700/40 dark:border-slate-800 pt-3">
            <p style="color: var(--text-muted);" class="text-[11px] font-en">جامعة المستقبل • كلية طب الأسنان التعليمية</p>
        </div>
    </div>

    <script>
        function toggleTheme() {
            const currentTheme = document.documentElement.getAttribute('data-theme') || 'dark';
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('dental_theme_mode', newTheme);
            updateThemeIcon(newTheme);
        }

        function updateThemeIcon(theme) {
            const icon = document.getElementById('themeIcon');
            if (icon) {
                icon.className = theme === 'light' ? 'fa-solid fa-sun text-amber-500' : 'fa-solid fa-moon text-sky-400';
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            const saved = localStorage.getItem('dental_theme_mode') || 'dark';
            document.documentElement.setAttribute('data-theme', saved);
            updateThemeIcon(saved);
        });

        function handleLogin(e) {
            e.preventDefault();
            const studentData = {
                name: document.getElementById('login_name').value.trim(),
                group: document.getElementById('login_group').value.trim(),
                stage: document.getElementById('login_stage').value
            };
            
            localStorage.setItem('dental_student_profile', JSON.stringify(studentData));
            window.location.href = 'clinics.html';
        }
    </script>
</body>
</html>
