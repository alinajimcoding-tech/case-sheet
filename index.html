<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DentalCase Pro Suite | تسجيل الدخول</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: { 50: '#f0f9ff', 100: '#e0f2fe', 400: '#38bdf8', 500: '#0ea5e9', 600: '#0284c7', 700: '#0369a1', 900: '#0c4a6e' }
                    },
                    fontFamily: { sans: ['IBM Plex Sans Arabic', 'sans-serif'], en: ['Readex Pro', 'sans-serif'] }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700;800&family=Readex+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --bg-body: #040812;
            --text-main: #f8fafc;
            --card-bg: rgba(15, 23, 42, 0.85);
            --card-border: rgba(56, 189, 248, 0.18);
            --input-bg: rgba(10, 15, 30, 0.95);
            --input-border: rgba(255, 255, 255, 0.15);
        }
        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            font-family: 'IBM Plex Sans Arabic', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow-x: hidden;
        }
        .ambient-glow {
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(14, 165, 233, 0.18) 0%, transparent 70%);
            border-radius: 50%;
            filter: blur(90px);
            pointer-events: none;
            z-index: 0;
        }
        .bento-card {
            background: var(--card-bg);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--card-border);
            border-radius: 2.25rem;
            box-shadow: 0 30px 60px -15px rgba(0, 0, 0, 0.7), 0 0 40px rgba(14, 165, 233, 0.12);
            position: relative;
            z-index: 10;
        }
        .glass-input {
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            color: inherit;
            transition: all 0.3s ease;
            font-size: 15px;
        }
        .glass-input:focus {
            outline: none;
            border-color: #38bdf8;
            box-shadow: 0 0 0 4px rgba(56, 189, 248, 0.25);
            background: rgba(15, 23, 42, 0.98);
        }
        
        /* زر مودرن فائق الحداثة بتأثيرات إضاءة متطورة */
        .btn-modern-ultra {
            position: relative;
            background: linear-gradient(135deg, #0369a1 0%, #0284c7 40%, #0ea5e9 80%, #38bdf8 100%);
            border: 1px solid rgba(125, 211, 252, 0.5);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 10px 30px -5px rgba(14, 165, 233, 0.5);
            overflow: hidden;
        }
        .btn-modern-ultra::before {
            content: '';
            position: absolute;
            top: 0; left: -100%; width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: 0.6s;
        }
        .btn-modern-ultra:hover::before {
            left: 100%;
        }
        .btn-modern-ultra:hover {
            transform: translateY(-3px);
            box-shadow: 0 20px 45px -10px rgba(56, 189, 248, 0.8);
            border-color: rgba(255, 255, 255, 0.8);
        }
        .btn-modern-ultra:hover .icon-box {
            transform: scale(1.15) rotate(-10deg);
            background: rgba(255, 255, 255, 0.25);
        }
        .icon-box {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
    </style>
</head>
<body class="p-4 sm:p-6">

    <div class="ambient-glow -top-32 -right-32"></div>
    <div class="ambient-glow -bottom-32 -left-32"></div>

    <div class="bento-card p-8 sm:p-12 max-w-xl w-full space-y-8">
        
        <!-- رأس البطاقة والأيقونة -->
        <div class="text-center space-y-4">
            <div class="w-24 h-24 rounded-3xl bg-gradient-to-br from-sky-500/20 to-cyan-500/10 border border-sky-500/30 flex items-center justify-center text-sky-400 text-4xl mx-auto shadow-2xl">
                <i class="fa-solid fa-tooth"></i>
            </div>
            <div>
                <h1 class="text-2xl sm:text-3xl font-extrabold text-white tracking-tight">المنظومة السريرية لطب الأسنان</h1>
                <p class="text-sm sm:text-base text-sky-400/90 font-en mt-1.5 font-semibold">DentalCase Pro Suite • Clinical Portal</p>
            </div>
        </div>

        <!-- نموذج تسجيل الدخول -->
        <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-6 text-sm sm:text-base">
            <div>
                <label class="block font-bold mb-2.5 text-slate-200">
                    <i class="fa-solid fa-user-pen text-sky-400 ml-2"></i> اسم الطالب الرباعي واللقب:
                </label>
                <input type="text" id="login_name" required class="glass-input w-full px-5 py-4 rounded-2xl font-bold" placeholder="مثال: علي نجم عبيد">
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
                <div>
                    <label class="block font-bold mb-2.5 text-slate-200">
                        <i class="fa-solid fa-users-rectangle text-sky-400 ml-2"></i> المجموعة الدراسية:
                    </label>
                    <input type="text" id="login_group" required class="glass-input w-full px-5 py-4 rounded-2xl font-en text-center font-bold" placeholder="e.g. D2">
                </div>
                <div>
                    <label class="block font-bold mb-2.5 text-slate-200">
                        <i class="fa-solid fa-graduation-cap text-sky-400 ml-2"></i> المرحلة الدراسية:
                    </label>
                    <!-- خيارات المرحلة الرابعة والخامسة فقط بشكل واضح ونظيف -->
                    <select id="login_stage" class="glass-input w-full px-5 py-4 rounded-2xl font-bold">
                        <option value="4th Year">المرحلة الرابعة</option>
                        <option value="5th Year">المرحلة الخامسة</option>
                    </select>
                </div>
            </div>

            <div class="pt-4">
                <button type="submit" class="btn-modern-ultra w-full py-4.5 rounded-2xl text-white font-extrabold text-base sm:text-lg flex items-center justify-between px-6">
                    <span class="flex items-center gap-2">
                        <i class="fa-solid fa-arrow-right-to-bracket text-lg"></i>
                        <span>الانتقال إلى لوحة العيادات</span>
                    </span>
                    <div class="icon-box w-10 h-10 rounded-xl bg-white/15 flex items-center justify-center">
                        <i class="fa-solid fa-arrow-left text-sm"></i>
                    </div>
                </button>
            </div>
        </form>

        <div class="text-center border-t border-slate-800/80 pt-5">
            <p class="text-xs sm:text-sm text-slate-400 font-en">جامعة المستقبل • كلية طب الأسنان التعليمية</p>
        </div>
    </div>

    <script>
        function handleLogin(e) {
            e.preventDefault();
            const studentData = {
                name: document.getElementById('login_name').value.trim(),
                group: document.getElementById('login_group').value.trim(),
                stage: document.getElementById('login_stage').value
            };
            
            localStorage.setItem('dental_student_profile', JSON.stringify(studentData));
            window.location.href = 'clinics.html';
        }
    </script>
</body>
</html>
