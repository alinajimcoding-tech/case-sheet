<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DentalCase Pro Suite | لوحة العيادات</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: { 50: '#f0f9ff', 100: '#e0f2fe', 400: '#38bdf8', 500: '#0ea5e9', 600: '#0284c7', 700: '#0369a1', 900: '#0c4a6e' }
                    },
                    fontFamily: { sans: ['IBM Plex Sans Arabic', 'sans-serif'], en: ['Readex Pro', 'sans-serif'] }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700;800&family=Readex+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --bg-body: #030712;
            --text-main: #e2e8f0;
            --text-muted: #94a3b8;
            --card-bg: rgba(15, 23, 42, 0.85);
            --card-border: rgba(56, 189, 248, 0.16);
            --clinic-bg: #090e1a;
            --clinic-border: rgba(56, 189, 248, 0.18);
            --clinic-hover-border: rgba(56, 189, 248, 0.5);
            --clinic-hover-bg: rgba(15, 23, 42, 0.95);
            --accent-text: #38bdf8;
            --sub-btn-bg: #0b1329;
            --sub-btn-border: rgba(56, 189, 248, 0.2);
        }

        /* الوضع النهاري */
        html[data-theme="light"] {
            --bg-body: #f4f4f7;
            --text-main: #18181b;
            --text-muted: #71717a;
            --card-bg: #ffffff;
            --card-border: #e4e4e7;
            --clinic-bg: #ffffff;
            --clinic-border: #e4e4e7;
            --clinic-hover-border: #2563eb;
            --clinic-hover-bg: #f8fafc;
            --accent-text: #1d4ed8;
            --sub-btn-bg: #f4f4f7;
            --sub-btn-border: #d4d4d8;
        }

        * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }

        html, body {
            width: 100%;
            min-height: 100%;
            overflow-x: hidden;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            font-family: 'IBM Plex Sans Arabic', sans-serif;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .main-wrapper {
            width: 100%;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.25rem 1rem;
            position: relative;
            overflow: hidden;
        }

        .ambient-glow {
            position: absolute;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(14, 165, 233, 0.12) 0%, transparent 70%);
            border-radius: 50%;
            filter: blur(80px);
            pointer-events: none;
            z-index: 0;
        }
        html[data-theme="light"] .ambient-glow {
            background: radial-gradient(circle, rgba(37, 99, 235, 0.06) 0%, transparent 70%);
        }

        .container-box {
            width: 100%;
            max-width: 440px;
            margin: 0 auto;
            position: relative;
            z-index: 10;
        }

        .bento-card {
            background: var(--card-bg);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--card-border);
            border-radius: 1.5rem;
            box-shadow: 0 15px 35px -10px rgba(0, 0, 0, 0.3);
        }

        .clinic-card {
            background: var(--clinic-bg);
            border: 1px solid var(--clinic-border);
            border-radius: 1.25rem;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            box-shadow: 0 4px 15px -3px rgba(0, 0, 0, 0.1);
        }
        .clinic-card:hover {
            border-color: var(--clinic-hover-border);
            transform: translateY(-2px);
            background: var(--clinic-hover-bg);
            box-shadow: 0 12px 25px -8px rgba(37, 99, 235, 0.25);
        }
        #comingSoonModal.active { display: flex !important; }
    </style>
</head>
<body>

    <div class="main-wrapper">
        <div class="ambient-glow top-0 right-0"></div>
        <div class="ambient-glow bottom-0 left-0"></div>

        <div class="container-box space-y-4">
            
            <!-- رأس لوحة التحكم (معلومات الطالب) -->
            <div class="bento-card p-4 sm:p-5 flex items-center justify-between gap-3 text-right">
                <div class="flex items-center gap-3 min-w-0 flex-1">
                    <div class="w-12 h-12 rounded-2xl bg-sky-500/15 border border-sky-500/30 flex items-center justify-center text-sky-400 text-xl shadow-sm shrink-0">
                        <i class="fa-solid fa-user-doctor"></i>
                    </div>
                    <div class="min-w-0 flex-1">
                        <h2 id="student_display_name" class="text-sm sm:text-base font-extrabold truncate">جاري التحميل...</h2>
                        <p style="color: var(--accent-text);" class="text-xs font-en mt-0.5 font-bold truncate">المجموعة: <span id="student_display_group">---</span> • المرحلة: <span id="student_display_stage">---</span></p>
                    </div>
                </div>
                
                <div class="flex items-center gap-1.5 shrink-0">
                    <button onclick="toggleTheme()" class="w-9 h-9 rounded-xl text-xs text-sky-400 transition flex items-center justify-center" style="background: var(--sub-btn-bg); border: 1px solid var(--sub-btn-border);" title="تبديل الوضع">
                        <i id="themeIcon" class="fa-solid fa-moon"></i>
                    </button>
                    <a href="index.html" class="px-2.5 py-2 rounded-xl text-xs font-bold transition flex items-center gap-1" style="background: var(--sub-btn-bg); border: 1px solid var(--sub-btn-border); color: var(--text-main);">
                        <i class="fa-solid fa-rotate-left text-[11px]"></i> <span>تعديل</span>
                    </a>
                </div>
            </div>

            <!-- قائمة عيادات الحالات السريرية -->
            <div class="space-y-2.5">
                <div class="flex items-center justify-between px-1">
                    <h3 style="color: var(--accent-text);" class="text-xs sm:text-sm font-bold flex items-center gap-2">
                        <i class="fa-solid fa-hospital-user"></i> عيادات طب الأسنان التعليمية (Case Sheets)
                    </h3>
                </div>

                <!-- شبكة العيادات الديناميكية -->
                <div id="clinicsGrid" class="grid grid-cols-1 gap-2.5"></div>
            </div>

            <!-- تذييل الصفحة -->
            <div class="text-center pt-2 border-t border-slate-700/40 dark:border-slate-800">
                <p style="color: var(--text-muted);" class="text-[11px] font-en">DentalCase Pro Suite • جامعة المستقبل</p>
            </div>
        </div>
    </div>

    <!-- Modal تنبيه قيد التحديث / قريباً -->
    <div id="comingSoonModal" class="fixed inset-0 z-[110] bg-slate-950/85 backdrop-blur-md p-4 hidden items-center justify-center">
        <div class="bento-card p-6 max-w-sm w-full text-center space-y-4 border border-amber-500/30 shadow-2xl">
            <div class="w-12 h-12 rounded-2xl bg-amber-500/10 border border-amber-500/30 flex items-center justify-center text-amber-400 text-xl mx-auto">
                <i class="fa-solid fa-person-digging"></i>
            </div>
            <div class="space-y-1">
                <h3 id="modalClinicTitle" class="text-sm font-bold">عيادة قيد التحديث</h3>
                <p style="color: var(--text-muted);" class="text-xs leading-relaxed">الشيت الخاص بهذه العيادة قيد التطوير وسيتاح في التحديث القادم.</p>
            </div>
            <button onclick="hideComingSoonModal()" class="w-full py-2 rounded-xl bg-amber-600 hover:bg-amber-500 text-white font-bold text-xs shadow-md transition">
                حسناً (إغلاق)
            </button>
        </div>
    </div>

    <script>
        function toggleTheme() {
            const currentTheme = document.documentElement.getAttribute('data-theme') || 'dark';
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('dental_theme_mode', newTheme);
            updateThemeIcon(newTheme);
        }

        function updateThemeIcon(theme) {
            const icon = document.getElementById('themeIcon');
            if (icon) {
                icon.className = theme === 'light' ? 'fa-solid fa-sun text-amber-500' : 'fa-solid fa-moon text-sky-400';
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            const savedTheme = localStorage.getItem('dental_theme_mode') || 'dark';
            document.documentElement.setAttribute('data-theme', savedTheme);
            updateThemeIcon(savedTheme);

            const profileStr = localStorage.getItem('dental_student_profile');
            if (!profileStr) {
                window.location.href = 'index.html';
                return;
            }

            const profile = JSON.parse(profileStr);
            document.getElementById('student_display_name').innerText = profile.name || 'طالب غير مسجل';
            document.getElementById('student_display_group').innerText = profile.group || '---';
            document.getElementById('student_display_stage').innerText = profile.stage === '5th Year' ? 'المرحلة الخامسة' : 'المرحلة الرابعة';

            const grid = document.getElementById('clinicsGrid');
            let html = '';

            if (profile.stage === '5th Year') {
                html = `
                    <div onclick="showComingSoonModal('Periodontics (5th Year)')" class="clinic-card p-3.5 sm:p-4 flex items-center justify-between group">
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 rounded-xl bg-emerald-500/15 text-emerald-400 flex items-center justify-center text-base shrink-0"><i class="fa-solid fa-tooth"></i></div>
                            <div class="text-right"><h4 class="font-bold text-xs sm:text-sm">Periodontics (5th Year)</h4><p style="color: var(--text-muted);" class="text-[10px] sm:text-[11px] mt-0.5">عيادة أمراض اللثة - مرحلة خامسة</p></div>
                        </div>
                        <span class="text-[9px] bg-amber-500/15 text-amber-400 px-2 py-0.5 rounded-full font-bold shrink-0">قريباً</span>
                    </div>
                    <a href="prostho_5th.html" class="clinic-card p-3.5 sm:p-4 flex items-center justify-between group">
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 rounded-xl bg-blue-500/15 text-blue-400 flex items-center justify-center text-base shrink-0"><i class="fa-solid fa-teeth"></i></div>
                            <div class="text-right"><h4 class="font-bold text-xs sm:text-sm">Complete Denture (5th Year)</h4><p style="color: var(--text-muted);" class="text-[10px] sm:text-[11px] mt-0.5">عيادة صناعة الأسنان (المرحلة الخامسة)</p></div>
                        </div>
                        <i class="fa-solid fa-arrow-left text-slate-500 group-hover:text-blue-400 transition transform group-hover:-translate-x-1 shrink-0"></i>
                    </a>
                    <a href="operative_5th.html" class="clinic-card p-3.5 sm:p-4 flex items-center justify-between group">
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 rounded-xl bg-sky-500/15 text-sky-400 flex items-center justify-center text-base shrink-0"><i class="fa-solid fa-syringe"></i></div>
                            <div class="text-right"><h4 class="font-bold text-xs sm:text-sm">Operative (5th Year)</h4><p style="color: var(--text-muted);" class="text-[10px] sm:text-[11px] mt-0.5">عيادة معالجة الأسنان - مرحلة خامسة</p></div>
                        </div>
                        <i class="fa-solid fa-arrow-left text-slate-500 group-hover:text-blue-400 transition transform group-hover:-translate-x-1 shrink-0"></i>
                    </a>
                    <a href="surgery_5th.html" class="clinic-card p-3.5 sm:p-4 flex items-center justify-between group">
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 rounded-xl bg-sky-500/15 text-sky-400 flex items-center justify-center text-base shrink-0"><i class="fa-solid fa-scalpel"></i></div>
                            <div class="text-right"><h4 class="font-bold text-xs sm:text-sm">Oral Surgery (5th Year)</h4><p style="color: var(--text-muted);" class="text-[10px] sm:text-[11px] mt-0.5">عيادة جراحة الفم - مرحلة خامسة</p></div>
                        </div>
                        <i class="fa-solid fa-arrow-left text-slate-500 group-hover:text-blue-400 transition transform group-hover:-translate-x-1 shrink-0"></i>
                    </a>
                    <a href="pedodontics_5th.html" class="clinic-card p-3.5 sm:p-4 flex items-center justify-between group">
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 rounded-xl bg-purple-500/15 text-purple-400 flex items-center justify-center text-base shrink-0"><i class="fa-solid fa-child"></i></div>
                            <div class="text-right"><h4 class="font-bold text-xs sm:text-sm">Pedodontics (5th Year)</h4><p style="color: var(--text-muted);" class="text-[10px] sm:text-[11px] mt-0.5">عيادة طب أسنان الأطفال - مرحلة خامسة</p></div>
                        </div>
                        <i class="fa-solid fa-arrow-left text-slate-500 group-hover:text-blue-400 transition transform group-hover:-translate-x-1 shrink-0"></i>
                    </a>
                `;
            } else {
                html = `
                    <a href="perio.html" class="clinic-card p-3.5 sm:p-4 flex items-center justify-between group">
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 rounded-xl bg-emerald-500/15 text-emerald-400 flex items-center justify-center text-base shrink-0"><i class="fa-solid fa-tooth"></i></div>
                            <div class="text-right"><h4 class="font-bold text-xs sm:text-sm">Periodontics (4th Year)</h4><p style="color: var(--text-muted);" class="text-[10px] sm:text-[11px] mt-0.5">عيادة أمراض اللثة - مرحلة رابعة</p></div>
                        </div>
                        <i class="fa-solid fa-arrow-left text-slate-500 group-hover:text-blue-400 transition transform group-hover:-translate-x-1 shrink-0"></i>
                    </a>
                    <a href="prostho.html" class="clinic-card p-3.5 sm:p-4 flex items-center justify-between group">
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 rounded-xl bg-blue-500/15 text-blue-400 flex items-center justify-center text-base shrink-0"><i class="fa-solid fa-teeth"></i></div>
                            <div class="text-right"><h4 class="font-bold text-xs sm:text-sm">Prosthodontics (4th Year)</h4><p style="color: var(--text-muted);" class="text-[10px] sm:text-[11px] mt-0.5">عيادة صناعة الأسنان - مرحلة رابعة</p></div>
                        </div>
                        <i class="fa-solid fa-arrow-left text-slate-500 group-hover:text-blue-400 transition transform group-hover:-translate-x-1 shrink-0"></i>
                    </a>
                    <a href="operative.html" class="clinic-card p-3.5 sm:p-4 flex items-center justify-between group">
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 rounded-xl bg-sky-500/15 text-sky-400 flex items-center justify-center text-base shrink-0"><i class="fa-solid fa-syringe"></i></div>
                            <div class="text-right"><h4 class="font-bold text-xs sm:text-sm">Operative Dentistry (4th Year)</h4><p style="color: var(--text-muted);" class="text-[10px] sm:text-[11px] mt-0.5">عيادة معالجة الأسنان - مرحلة رابعة</p></div>
                        </div>
                        <i class="fa-solid fa-arrow-left text-slate-500 group-hover:text-blue-400 transition transform group-hover:-translate-x-1 shrink-0"></i>
                    </a>
                    <a href="surgery.html" class="clinic-card p-3.5 sm:p-4 flex items-center justify-between group">
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 rounded-xl bg-sky-500/15 text-sky-400 flex items-center justify-center text-base shrink-0"><i class="fa-solid fa-scalpel"></i></div>
                            <div class="text-right"><h4 class="font-bold text-xs sm:text-sm">Oral Surgery (4th Year)</h4><p style="color: var(--text-muted);" class="text-[10px] sm:text-[11px] mt-0.5">عيادة جراحة الفم - مرحلة رابعة</p></div>
                        </div>
                        <i class="fa-solid fa-arrow-left text-slate-500 group-hover:text-blue-400 transition transform group-hover:-translate-x-1 shrink-0"></i>
                    </a>
                `;
            }
            grid.innerHTML = html;
        });

        function showComingSoonModal(clinicName) {
            document.getElementById('modalClinicTitle').innerText = 'عيادة ' + clinicName;
            document.getElementById('comingSoonModal').classList.add('active');
        }

        function hideComingSoonModal() {
            document.getElementById('comingSoonModal').classList.remove('active');
        }
    </script>
</body>
</html>
